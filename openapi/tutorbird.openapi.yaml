        referrer:
          type: string
        note:
          type: string
        skypeUsername:
          type: string
          deprecated: true
        school:
          type: string
        faceTimeId:
          type: string
        subjects:
          type: string
          description: Zapier field `SubjectTypes`.
        groupTagIds:
          type: string
          description: |
