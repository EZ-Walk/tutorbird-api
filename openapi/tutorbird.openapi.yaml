openapi: 3.1.0
info:
  title: TutorBird API
  version: 0.2.0
  summary: Unofficial specification of the TutorBird integration API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Unofficial community specification
  description: |
    Unofficial OpenAPI description of the TutorBird integration surface.

    TutorBird lets an account owner create an API key under **Business Settings → Integrations**
    and connect that key to Zapier. The help center documents the triggers, actions, identifier
    prefixes, and field formats. TutorBird does not publish an OpenAPI document of its own.

    Calls against `https://api.tutorbird.com` on 2026-10-08 confirmed the student, parent, and
    family routes. Those operations are marked `x-path-status: confirmed`. Wire names on the
    confirmed routes are PascalCase (`FirstName`, `FamilyID`, `ItemSubset`). Event, attendance,
    payment, and webhook operations were not called and stay `x-path-status: inferred`.

    `GET /v1` (the bare version root) can return HTTP 500 even when the resource routes succeed.
    Do not use it as a health check.

    Field names on inferred operations still follow TutorBird's help center and the public Zapier
    app listing. Where those two sources use different names for the same input, the schema
    description records both.

    This project is not affiliated with TutorBird. TutorBird is a trademark of its owner.

    ## Sources

    Retrieved 2026-10-03.

    - [How do I integrate with Zapier?](https://support.tutorbird.com/en/articles/963-how-do-i-integrate-with-zapier)
    - [What can I do with TutorBird & Zapier?](https://support.tutorbird.com/en/articles/965-what-can-i-do-with-tutorbird-zapier)
    - [Zapier Triggers](https://support.tutorbird.com/en/articles/1062-zapier-triggers)
    - [Zapier Actions](https://support.tutorbird.com/en/articles/1063-zapier-actions)
    - [Zapier app listing](https://zapier.com/apps/tutorbird/integrations)

    ## Authentication

    Create a key in TutorBird:

    1. Open the account menu and choose **Business Settings**.
    2. Open the **Integrations** tab and choose **+ Add API Key**.
    3. Name the key and choose **Read-Only** or **Read & Write**.
    4. Copy the key from the dialog. TutorBird shows it once.

    Read-only keys can supply data to an external app. Read & write keys can also change
    TutorBird data, such as adding a student. A multi-tutor account requires the Administrator
    privilege to create a key.

    Send the key on TutorBird requests as `Authorization: Bearer <apiKey>`.

    ## Identifier prefixes

    | Resource | Prefix | Example shape |
    | --- | --- | --- |
    | Student | `sdt_` | `sdt_xxxxxx` |
    | Family | `fml_` | `fml_xxxxxx` |
    | Parent | `prt_` | `prt_xxxxxx` |
    | Event | `evt_` | `evt_xxxxxxxx` |
    | Attendance | `atn_` | `atn_xxxxxxxx` |
    | Teacher | `tch_` | `tch_xxxxxx` |
    | Invoice number | `inv_` | `inv_xxxxxxx` |
    | Payment created by Add Payment | `rcv_` | `rcv_xxxxxxxx` |
    | Payment on the Payment Added trigger | `csh_` | `csh_xxxxxxxx` |

    The `rcv_` and `csh_` values are both published as payment identifiers, on different operations.
    This spec does not treat them as the same field.

servers:
  - url: https://api.tutorbird.com/v1
    description: >
      TutorBird API host. Student, parent, and family paths were confirmed on 2026-10-08.
      Event, attendance, and payment paths are still inferred. Do not send GET to this
      server root as a health check; it can return HTTP 500 while resource routes work.

security:
  - bearerAuth: []

tags:
  - name: Students
    description: Create, update, and find student profiles.
  - name: Families
    description: >
      Read families and parents, create a parent on an existing family, and update a parent.
      There is no create-family route. A family is created only by adding a student.
  - name: Calendar
    description: Find events and attendance.
  - name: Payments
    description: Record a payment on a family account.
  - name: Webhooks
    description: >
      Events TutorBird can emit. Native webhook signing and retry behavior are not published.
      Payload fields below are the fields TutorBird documents for the matching Zapier trigger.

paths:
  /students:
    get:
      tags: [Students]
      operationId: listStudents
      x-path-status: confirmed
      x-zapier-key: search_student
      x-required-permission: read
      summary: List students
      description: |
        Returns the full student list as `ItemSubset` plus `TotalItemCount`.

        A search query string is ignored. The route does not filter by name or email.
        Use `GET /students/{studentId}` when you already have an id.
      parameters:
        - name: search
          in: query
          required: false
          deprecated: true
          description: Ignored. The route returns the full list.
          schema:
            type: string
      responses:
        "200":
          description: The full student list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentList"
              example:
                ItemSubset:
                  - FirstName: Maya
                    LastName: Chen
                    Status: Trial
                    FamilyID: fml_91c0ab
                    SkillLevel: Grade 6
                    LocalSchool: Harbour Elementary
                    Note: Prefers afternoon lessons
                    Telephone:
                      TelephoneNumber: "+1-416-555-0148"
                      TextingAllowed: true
                TotalItemCount: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Students]
      operationId: addStudent
      x-path-status: confirmed
      x-zapier-key: add_student
      x-required-permission: read-write
      summary: Add a student
      description: |
        Creates a student. There is no delete route. Retire a duplicate with
        `PUT /students/{studentId}` and `{"Status": "Inactive"}`.

        Required: `FirstName` and `LastName` (non-empty, max 60 characters), and exactly
        one of `Family` or `FamilyID`.

        To join an existing family, send `FamilyID` (`fml_...`) and do not send `Family`.

        To create a new family, send `Family` as an object (`FamilyName` is optional) and
        send `"Adult": {}`. Omitting `Adult`, or sending a populated `Adult`, returns
        HTTP 400 with `StudentInputItem.Adult: Must be null for new family`. The empty
        object is what the server accepts for a child on a new family. `POST /families`
        does not exist (HTTP 404). On create, `FamilyName` is combined with the names of
        the people added.

        Fields that persist on create: `Status` (`Active`, `Inactive`, `Waiting`, `Lead`,
        `Trial`), `Telephone` as `{"TelephoneNumber": "...", "TextingAllowed": true}`,
        `SkillLevel`, `LocalSchool`, and `Note`.

        Nested `Email` (`{"EmailAddress": "..."}`) does not persist on create. Set email
        afterward with `PUT` and a flat `EmailAddress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStudentRequest"
            examples:
              newFamily:
                summary: Child on a new family
                value:
                  FirstName: Maya
                  LastName: Chen
                  Status: Trial
                  Family:
                    FamilyName: Chen
                  Adult: {}
                  Telephone:
                    TelephoneNumber: "+1-416-555-0148"
                    TextingAllowed: true
                  SkillLevel: Grade 6
                  LocalSchool: Harbour Elementary
                  Note: Prefers afternoon lessons
              existingFamily:
                summary: Join an existing family
                value:
                  FirstName: Maya
                  LastName: Chen
                  Status: Trial
                  FamilyID: fml_91c0ab
                  Telephone:
                    TelephoneNumber: "+1-416-555-0148"
                    TextingAllowed: true
                  SkillLevel: Grade 6
                  LocalSchool: Harbour Elementary
                  Note: Prefers afternoon lessons
      responses:
        "200":
          description: |
            JSON string of the new student id (`sdt_...`). Not an object, and not HTTP 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentId"
              example: sdt_4f8a21
        "400":
          description: |
            The body failed validation. Creating a family without `Adult`, or with a
            populated `Adult`, includes the message
            `StudentInputItem.Adult: Must be null for new family`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{studentId}:
    parameters:
      - $ref: "#/components/parameters/studentId"
    get:
      tags: [Students]
      operationId: findStudent
      x-path-status: confirmed
      x-zapier-key: search_student
      x-required-permission: read
      summary: Find a student by id
      description: |
        Returns one student. The identifier uses the `sdt_` prefix.
        `GET /students` does not filter, so this is the lookup when you already have an id.
      responses:
        "200":
          description: The student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
              example:
                FirstName: Maya
                LastName: Chen
                Status: Trial
                FamilyID: fml_91c0ab
                EmailAddress: maya.chen@example.com
                SkillLevel: Grade 6
                LocalSchool: Harbour Elementary
                Note: Prefers afternoon lessons
                Telephone:
                  TelephoneNumber: "+1-416-555-0148"
                  TextingAllowed: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Students]
      operationId: updateStudent
      x-path-status: confirmed
      x-zapier-key: update_student
      x-required-permission: read-write
      summary: Update a student
      description: |
        Partial body is accepted. Success is HTTP 200 and JSON `true`.

        Email persists only as a flat property: `{"EmailAddress": "name@example.com"}`.
        Nested `Email`, `email`, and `StudentEmail` do not stick.

        Status updates with `{"Status": "Inactive"}` (also `Active`, `Waiting`, `Lead`,
        or `Trial`). There is no delete; set `Inactive` to retire a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
            example:
              Status: Inactive
              EmailAddress: maya.chen@example.com
      responses:
        "200":
          description: JSON `true` when the update is applied.
          content:
            application/json:
              schema:
                type: boolean
              example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Students]
      operationId: patchStudent
      x-path-status: confirmed
      x-zapier-key: update_student
      x-required-permission: read-write
      summary: Patch a student is not allowed
      description: |
        `PATCH` returns HTTP 405. Update with `PUT`.
      responses:
        "405":
          description: Method not allowed. Use PUT.

  /parents:
    get:
      tags: [Families]
      operationId: listParents
      x-path-status: confirmed
      x-zapier-key: search_parents
      x-required-permission: read
      summary: List parents
      description: |
        Returns parents. Identifiers use the `prt_` prefix. The collection envelope was
        not recorded on 2026-10-08 (student lists use `ItemSubset` and `TotalItemCount`).

        Zapier documents family id, search text, and limit filters. Those query parameters
        were not confirmed. Read one parent with `GET /parents/{parentId}`.
      responses:
        "200":
          description: |
            Parents for the account. Record fields that were confirmed are on `Parent`.
            The list envelope itself was not recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnrecordedList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Families]
      operationId: addParent
      x-path-status: confirmed
      x-required-permission: read-write
      summary: Add a parent
      description: |
        Creates a parent on an existing family. `FamilyID` is required and must already
        exist. There is no `POST /families` (HTTP 404). A new family is created only as a
        side effect of `POST /students` with `Family` and `"Adult": {}`.

        Success is HTTP 200 and a JSON string of the new `prt_` id.

        `FirstName` and `LastName` persist. Nested `Email` and `MobileTelephone` on the
        create body do not. Set email afterward with `PUT` and a flat `EmailAddress`.
        Parent mobile did not persist through the update fields tried on 2026-10-08.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParentRequest"
            example:
              FamilyID: fml_91c0ab
              FirstName: Elise
              LastName: Chen
      responses:
        "200":
          description: JSON string of the new parent id (`prt_...`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentId"
              example: prt_10aa20
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /parents/{parentId}:
    parameters:
      - $ref: "#/components/parameters/parentId"
    get:
      tags: [Families]
      operationId: findParent
      x-path-status: confirmed
      x-zapier-key: search_parent
      x-required-permission: read
      summary: Find a parent by id
      description: Returns one parent. The identifier uses the `prt_` prefix.
      responses:
        "200":
          description: The parent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
              example:
                FirstName: Elise
                LastName: Chen
                FamilyID: fml_91c0ab
                EmailAddress: elise.chen@example.com
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Families]
      operationId: updateParent
      x-path-status: confirmed
      x-required-permission: read-write
      summary: Update a parent
      description: |
        Parent email persists as a flat property: `{"EmailAddress": "..."}`.

        Parent mobile does not persist via `MobileTelephone`, `TelephoneNumber`,
        `PhoneNumber`, `MobileTelephoneNumber`, or `MobilePhone`. That is a known gap.

        `IsPreferredInvoiceRecipient` did not persist on PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateParentRequest"
            example:
              EmailAddress: elise.chen@example.com
      responses:
        "200":
          description: The update was accepted.
          content:
            application/json:
              schema:
                description: Response body was not recorded beyond a successful PUT.
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /families:
    get:
      tags: [Families]
      operationId: listFamilies
      x-path-status: confirmed
      x-required-permission: read
      summary: List families
      description: |
        Returns families. Identifiers use the `fml_` prefix. The collection envelope was
        not recorded on 2026-10-08 (student lists use `ItemSubset` and `TotalItemCount`).

        Nested `Students` and `Parents` arrays on the family payload come back empty.
        Use the student and parent routes for those records.
      responses:
        "200":
          description: |
            Families for the account. Record fields that were confirmed are on `Family`.
            The list envelope itself was not recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnrecordedList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Families]
      operationId: addFamily
      x-path-status: confirmed
      x-required-permission: read-write
      summary: Create family is not a route
      description: |
        `POST /families` returns HTTP 404. Create a family by `POST /students` with
        `Family` and `"Adult": {}`. Add further parents with `POST /parents` and that
        family's `FamilyID`.
      responses:
        "404":
          description: No create-family route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /families/{familyId}:
    parameters:
      - $ref: "#/components/parameters/familyId"
    get:
      tags: [Families]
      operationId: findFamily
      x-path-status: confirmed
      x-required-permission: read
      summary: Find a family by id
      description: |
        Returns one family. The identifier uses the `fml_` prefix.

        Nested `Students` and `Parents` arrays come back empty. Use
        `GET /students/{studentId}` and `GET /parents/{parentId}` for those records.
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
              example:
                FamilyName: Chen
                Students: []
                Parents: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Families]
      operationId: updateFamilyName
      x-path-status: confirmed
      x-required-permission: read-write
      summary: Append to a family name
      description: |
        `{"FamilyName": "..."}` appends `"; "` and the submitted text to the current name.
        It does not replace the name. On student create, `Family.FamilyName` is combined
        with the names of the people added. Do not use this write as a safe rename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
            example:
              FamilyName: Chen Studio
      responses:
        "200":
          description: |
            The write was accepted. The stored name is the previous name, then `"; "`,
            then the submitted text.
          content:
            application/json:
              schema:
                description: Response body was not recorded beyond a successful PUT.
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags: [Calendar]
      operationId: findEvent
      x-path-status: inferred
      x-zapier-key: search_event
      x-required-permission: read
      summary: Find an event
      description: |
        Retrieves one calendar event by id. Attendee-specific fields are returned once per
        attendee. Zapier field name is `EventID`.
      responses:
        "200":
          description: The event, including attendees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              example:
                id: evt_77ab9001
                allDay: false
                startDateTime: "2026-03-10 16:00:00"
                endDateTime: "2026-03-10 16:45:00"
                durationMinutes: 45
                category: Piano
                location: Studio A
                description: Weekly lesson
                note: Bring the new book
                currentAttendeeCount: 1
                maxParticipants: 1
                makeupCreditRequired: false
                teacherId: tch_2200aa
                teacherFirstName: Priya
                teacherLastName: Shah
                teacherFullName: Priya Shah
                attendees:
                  - studentId: sdt_4f8a21
                    firstName: Maya
                    lastName: Chen
                    fullName: Maya Chen
                    attendanceStatus: Unrecorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /students/{studentId}/attendance:
    parameters:
      - $ref: "#/components/parameters/studentId"
    get:
      tags: [Calendar]
      operationId: findAttendance
      x-path-status: inferred
      x-zapier-key: search_attendance
      x-required-permission: read
      summary: Find attendance records
      description: |
        Finds attendance for one student. Zapier requires `StudentID` and accepts optional
        `limit` and `orderby`. The help center publishes the student id and limit.

        The actions article does not publish the attendance search output columns. The schema
        uses the fields published for the **Attendance Taken** trigger, which is the documented
        attendance record.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximum records to return.
        - name: orderby
          in: query
          required: false
          schema:
            type: string
          description: >
            Sort expression. Zapier lists the parameter name `orderby` and does not publish
            the allowed values.
      responses:
        "200":
          description: Attendance records for the student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
              example:
                - id: atn_10000001
                  eventId: evt_77ab9001
                  studentId: sdt_4f8a21
                  familyId: fml_91c0ab
                  attendanceStatus: Present
                  parentNote: Arrived on time
                  privateNote: ""
                  studentNotes: Scales and a new piece
                  hasAttachments: false
                  emailReminderSent: true
                  smsReminderSent: false
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments:
    post:
      tags: [Payments]
      operationId: addPayment
      x-path-status: inferred
      x-zapier-key: add_payment
      x-required-permission: read-write
      summary: Add a payment
      description: |
        Records a payment on a family account.

        Zapier requires `Amount`, `Timestamp`, and `FamilyID`. Description is optional.
        The help center names the timestamp field **Date & Time**.

        The create action returns a payment id with the `rcv_` prefix. The **Payment Added**
        trigger identifies the payment with a `csh_` prefix. Both are documented; this response
        returns the create-action id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPaymentRequest"
            example:
              familyId: fml_91c0ab
              amount: 85.00
              timestamp: "2026-03-09 14:05:00"
              description: March piano lesson
      responses:
        "201":
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPaymentResult"
              example:
                id: rcv_50000001
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

webhooks:
  studentAdded:
    post:
      operationId: studentAdded
      x-zapier-key: student_added
      summary: New student
      description: |
        Fires when a student is added in the app or through a signup form. Includes the family
        id so a later step can find parents.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentEvent"
      responses:
        "200":
          description: Acknowledge receipt.

  studentUpdated:
    post:
      operationId: studentUpdated
      x-zapier-key: student_updated
      summary: Student updated
      description: |
        Fires when any student profile field changes, so it can run often. TutorBird recommends
        filtering on the field you care about, such as status or email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentEvent"
      responses:
        "200":
          description: Acknowledge receipt.

  attendanceTaken:
    post:
      operationId: attendanceTaken
      x-zapier-key: attendance_updated
      summary: Attendance taken
      description: Fires when attendance is taken or edited for a calendar event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRecord"
      responses:
        "200":
          description: Acknowledge receipt.

  studentAddedToEvent:
    post:
      operationId: studentAddedToEvent
      x-zapier-key: attendance_added
      summary: Student added to an event
      description: Fires when a student is added to a calendar event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentAddedToEvent"
      responses:
        "200":
          description: Acknowledge receipt.

  invoiceAdded:
    post:
      operationId: invoiceAdded
      x-zapier-key: invoice_added
      summary: New invoice
      description: Fires when an invoice is created manually or by auto-invoicing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Invoice"
      responses:
        "200":
          description: Acknowledge receipt.

  paymentAdded:
    post:
      operationId: paymentAdded
      x-zapier-key: payment_added
      summary: Payment added
      description: |
        Fires when a payment is recorded on a family account, including manual payments,
        online payments, and Auto Pay.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          description: Acknowledge receipt.

  emailAdded:
    post:
      operationId: emailAdded
      x-zapier-key: email_added
      summary: New email
      description: |
        Fires when a new email message is created. The Zapier listing publishes the event and
        does not publish its fields. The payload is left open.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpublishedEvent"
      responses:
        "200":
          description: Acknowledge receipt.

  smsAdded:
    post:
      operationId: smsAdded
      x-zapier-key: sms_added
      summary: New SMS
      description: |
        Fires when a new SMS message is created. The Zapier listing publishes the event and
        does not publish its fields. The payload is left open.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpublishedEvent"
      responses:
        "200":
          description: Acknowledge receipt.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key created under Business Settings → Integrations.
        Send it as `Authorization: Bearer <apiKey>`.

  parameters:
    studentId:
      name: studentId
      in: path
      required: true
      description: Student id (`sdt_`).
      schema:
        $ref: "#/components/schemas/StudentId"
    parentId:
      name: parentId
      in: path
      required: true
      description: Parent id (`prt_`).
      schema:
        $ref: "#/components/schemas/ParentId"
    familyId:
      name: familyId
      in: path
      required: true
      description: Family id (`fml_`).
      schema:
        $ref: "#/components/schemas/FamilyId"
    eventId:
      name: eventId
      in: path
      required: true
      description: Event id (`evt_`).
      schema:
        $ref: "#/components/schemas/EventId"
  responses:
    Unauthorized:
      description: |
        Conventional status when the API key is missing or rejected.
        TutorBird has not published its error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Conventional status when a read-only key calls a write operation.
        TutorBird documents the permission split and does not publish this status code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        Conventional status when the id does not match a record.
        TutorBird has not published this status code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    StudentId:
      type: string
      pattern: "^sdt_.+"
      example: sdt_4f8a21
      description: Student identifier. TutorBird documents the `sdt_` prefix.

    FamilyId:
      type: string
      pattern: "^fml_.+"
      example: fml_91c0ab
      description: Family identifier. TutorBird documents the `fml_` prefix.

    ParentId:
      type: string
      pattern: "^prt_.+"
      example: prt_10aa20
      description: Parent identifier. TutorBird documents the `prt_` prefix.

    EventId:
      type: string
      pattern: "^evt_.+"
      example: evt_77ab9001
      description: Event identifier. TutorBird documents the `evt_` prefix.

    AttendanceId:
      type: string
      pattern: "^atn_.+"
      example: atn_10000001
      description: Attendance identifier. TutorBird documents the `atn_` prefix.

    TeacherId:
      type: string
      pattern: "^tch_.+"
      example: tch_2200aa
      description: Teacher identifier. TutorBird documents the `tch_` prefix.

    InvoiceNumber:
      type: string
      pattern: "^inv_.+"
      example: inv_3000001
      description: Invoice number. TutorBird documents the `inv_` prefix.

    ReceiptId:
      type: string
      pattern: "^rcv_.+"
      example: rcv_50000001
      description: Payment id returned by Add Payment. TutorBird documents the `rcv_` prefix.

    CashEntryId:
      type: string
      pattern: "^csh_.+"
      example: csh_60000001
      description: Payment id on the Payment Added trigger. TutorBird documents the `csh_` prefix.

    DateOnly:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      example: "2026-03-09"
      description: Calendar date formatted `yyyy-mm-dd`.

    DateTimeLocal:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
      example: "2026-03-10 16:00:00"
      description: |
        Local date and time formatted `yyyy-mm-dd hh:mm:ss`. TutorBird does not document
        a numeric offset on these values. Find Student returns a separate time zone.

    StudentStatus:
      type: string
      enum: [Active, Inactive, Waiting, Lead, Trial]
      description: Published student statuses.

    InvoiceStatus:
      type: string
      enum: [Paid, Open]
      description: Published invoice status values. A separate `paid` boolean is also published.

    AttendanceStatus:
      type: string
      description: |
        Attendance status text. Documented examples are Unrecorded, Present, and Absent.
        The full list is not published.
      examples: [Unrecorded, Present, Absent]

    Telephone:
      type: object
      description: Student telephone. Persists on create.
      properties:
        TelephoneNumber:
          type: string
        TextingAllowed:
          type: boolean

    FamilyInput:
      type: object
      description: |
        Sent as `Family` when creating a student and a new family together.
        `FamilyName` is optional. On create it is combined with the names of the
        people added. A later `PUT /families/{familyId}` appends to the stored name
        with `"; "` and does not replace it.
      properties:
        FamilyName:
          type: string

    AddStudentRequest:
      type: object
      description: |
        Wire body for `POST /students`. Send exactly one of `FamilyID` or `Family`.
        When sending `Family`, also send `Adult` as an empty object.
      required: [FirstName, LastName]
      properties:
        FirstName:
          type: string
          minLength: 1
          maxLength: 60
        LastName:
          type: string
          minLength: 1
          maxLength: 60
        Status:
          $ref: "#/components/schemas/StudentStatus"
        FamilyID:
          allOf:
            - $ref: "#/components/schemas/FamilyId"
          description: Join this existing family. Do not also send `Family`.
        Family:
          $ref: "#/components/schemas/FamilyInput"
        Adult:
          type: object
          maxProperties: 0
          description: |
            Required as `{}` when `Family` creates a new family. A missing or
            populated object returns HTTP 400
            `StudentInputItem.Adult: Must be null for new family`.
        Telephone:
          $ref: "#/components/schemas/Telephone"
        SkillLevel:
          type: string
        LocalSchool:
          type: string
        Note:
          type: string

    UpdateStudentRequest:
      type: object
      description: |
        Partial body for `PUT /students/{studentId}`. Confirmed properties are
        `EmailAddress` and `Status`. Nested `Email`, `email`, and `StudentEmail`
        do not persist.
      properties:
        EmailAddress:
          type: string
          format: email
        Status:
          $ref: "#/components/schemas/StudentStatus"

    AddParentRequest:
      type: object
      required: [FamilyID, FirstName, LastName]
      description: |
        `FamilyID` must already exist. Nested `Email` and `MobileTelephone` do not
        persist on create.
      properties:
        FamilyID:
          $ref: "#/components/schemas/FamilyId"
        FirstName:
          type: string
          minLength: 1
          maxLength: 60
        LastName:
          type: string
          minLength: 1
          maxLength: 60

    UpdateParentRequest:
      type: object
      description: |
        Flat `EmailAddress` persists. Mobile does not persist via `MobileTelephone`,
        `TelephoneNumber`, `PhoneNumber`, `MobileTelephoneNumber`, or `MobilePhone`.
        `IsPreferredInvoiceRecipient` did not persist on PUT.
      properties:
        EmailAddress:
          type: string
          format: email

    UpdateFamilyRequest:
      type: object
      required: [FamilyName]
      description: |
        Appends `"; "` and `FamilyName` to the current family name. This is not a replace.
      properties:
        FamilyName:
          type: string
          minLength: 1

    StudentList:
      type: object
      required: [ItemSubset, TotalItemCount]
      properties:
        ItemSubset:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        TotalItemCount:
          type: integer
          minimum: 0

    Family:
      type: object
      additionalProperties: true
      description: |
        One family (`fml_`). `Students` and `Parents` come back empty; read those
        records from their own routes.
      properties:
        FamilyName:
          type: string
        Students:
          type: array
          items: {}
          description: Empty on this payload.
        Parents:
          type: array
          items: {}
          description: Empty on this payload.

    Student:
      type: object
      additionalProperties: true
      description: |
        One student from `GET /students` or `GET /students/{studentId}`.
        The identifier uses the `sdt_` prefix. Confirmed wire names are PascalCase.
        `EmailAddress` persists on PUT, not from nested `Email` on create.
      properties:
        FirstName:
          type: string
          maxLength: 60
        LastName:
          type: string
          maxLength: 60
        Status:
          $ref: "#/components/schemas/StudentStatus"
        FamilyID:
          $ref: "#/components/schemas/FamilyId"
        EmailAddress:
          type: string
          format: email
        Telephone:
          $ref: "#/components/schemas/Telephone"
        SkillLevel:
          type: string
        LocalSchool:
          type: string
        Note:
          type: string

    StudentEvent:
      type: object
      description: |
        Payload documented for New Student and Student Updated. Address and the adult-student
        parent id are called out in the help center tables.
      properties:
        id:
          $ref: "#/components/schemas/StudentId"
        adultParentId:
          $ref: "#/components/schemas/ParentId"
          description: Present for adult students only. Help center label "Adult Student Parent ID".
        birthday:
          $ref: "#/components/schemas/DateOnly"
        studentSince:
          $ref: "#/components/schemas/DateOnly"
        email:
          type: string
        faceTimeId:
          type: string
        familyId:
          $ref: "#/components/schemas/FamilyId"
        firstName:
          type: string
        lastName:
          type: string
        gender:
          type: string
        note:
          type: string
        address:
          type: string
          description: Published on New Student. Absent from the Student Updated table.
        referrer:
          type: string
        sendEmailReminders:
          type: boolean
        sendSmsReminders:
          type: boolean
        skillLevel:
          type: string
        status:
          $ref: "#/components/schemas/StudentStatus"
        subjects:
          type: string
        phoneNumber:
          type: string
        phoneSmsCapable:
          type: boolean
          description: Help center field "Texting Allowed".
        groupTags:
          type: string

    Parent:
      type: object
      additionalProperties: true
      description: |
        One parent (`prt_`). Confirmed on the HTTP API: `FirstName` and `LastName`
        persist on create, and flat `EmailAddress` persists on PUT. Mobile fields
        and `IsPreferredInvoiceRecipient` did not persist in the 2026-10-08 checks.
      properties:
        FirstName:
          type: string
        LastName:
          type: string
        FamilyID:
          $ref: "#/components/schemas/FamilyId"
        EmailAddress:
          type: string
          format: email

    Attendee:
      type: object
      properties:
        studentId:
          $ref: "#/components/schemas/StudentId"
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        attendanceStatus:
          $ref: "#/components/schemas/AttendanceStatus"

    Event:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        allDay:
          type: boolean
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        currentAttendeeCount:
          type: number
        description:
          type: string
        durationMinutes:
          type: number
        category:
          type: string
        location:
          type: string
        maxParticipants:
          type: number
        makeupCreditRequired:
          type: boolean
        note:
          type: string
        teacherId:
          $ref: "#/components/schemas/TeacherId"
        teacherFirstName:
          type: string
        teacherLastName:
          type: string
        teacherFullName:
          type: string
        startDateTime:
          $ref: "#/components/schemas/DateTimeLocal"
        endDateTime:
          $ref: "#/components/schemas/DateTimeLocal"

    AttendanceRecord:
      type: object
      description: Attendance record from the Attendance Taken trigger and the attendance search.
      properties:
        id:
          $ref: "#/components/schemas/AttendanceId"
        eventId:
          $ref: "#/components/schemas/EventId"
        studentId:
          $ref: "#/components/schemas/StudentId"
        familyId:
          $ref: "#/components/schemas/FamilyId"
        attendanceStatus:
          $ref: "#/components/schemas/AttendanceStatus"
        parentNote:
          type: string
        privateNote:
          type: string
        studentNotes:
          type: string
        hasAttachments:
          type: boolean
        emailReminderSent:
          type: boolean
        smsReminderSent:
          type: boolean

    StudentAddedToEvent:
      type: object
      description: Payload for the Student Added to Event trigger. Zapier key `attendance_added`.
      properties:
        id:
          $ref: "#/components/schemas/AttendanceId"
        eventId:
          $ref: "#/components/schemas/EventId"
        studentId:
          $ref: "#/components/schemas/StudentId"
        dateTime:
          $ref: "#/components/schemas/DateTimeLocal"
        category:
          type: string
        teacher:
          type: string
          description: Teacher name as text. This trigger does not publish a teacher id.
        familyId:
          $ref: "#/components/schemas/FamilyId"
        attendanceStatus:
          $ref: "#/components/schemas/AttendanceStatus"
        hasAttachments:
          type: boolean
        emailReminderSent:
          type: boolean
        smsReminderSent:
          type: boolean

    Invoice:
      type: object
      properties:
        number:
          $ref: "#/components/schemas/InvoiceNumber"
        startDate:
          $ref: "#/components/schemas/DateOnly"
        endDate:
          $ref: "#/components/schemas/DateOnly"
        dateCreated:
          $ref: "#/components/schemas/DateOnly"
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        amountDue:
          type: number
        dueDate:
          $ref: "#/components/schemas/DateOnly"
        emailed:
          type: boolean
        paid:
          type: boolean
        reminderDate:
          $ref: "#/components/schemas/DateOnly"
        void:
          type: boolean
        familyId:
          $ref: "#/components/schemas/FamilyId"
        familyName:
          type: string

    AddPaymentRequest:
      type: object
      required: [amount, timestamp, familyId]
      properties:
        amount:
          type: number
          description: Zapier field `Amount`.
        timestamp:
          allOf:
            - $ref: "#/components/schemas/DateTimeLocal"
          description: Zapier field `Timestamp`. Help center label "Date & Time".
        familyId:
          $ref: "#/components/schemas/FamilyId"
        description:
          type: string

    AddPaymentResult:
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/ReceiptId"

    PaymentEvent:
      type: object
      description: Payload for the Payment Added trigger.
      properties:
        id:
          $ref: "#/components/schemas/CashEntryId"
        date:
          $ref: "#/components/schemas/DateOnly"
        amount:
          type: number
        description:
          type: string
        payee:
          type: string
        method:
          type: string
          description: Payment method text. The allowed values are not published.
        familyId:
          $ref: "#/components/schemas/FamilyId"

    UnrecordedList:
      description: |
        A list route that succeeded on 2026-10-08 whose JSON envelope was not recorded.
        Student lists are the exception: they use `ItemSubset` and `TotalItemCount`.
      additionalProperties: true

    UnpublishedEvent:
      type: object
      description: |
        TutorBird publishes this event through Zapier and does not publish its fields.
        Additional properties are allowed so a captured payload can still be validated loosely.
      additionalProperties: true

    Error:
      type: object
      description: |
        Placeholder error body. TutorBird has not published an error schema. Do not depend
        on these property names.
      properties:
        message:
          type: string
